<!--
  BetterMaddela identity mark - "The Ridge Mon" (owner-selected from the
  /logo-lab decision round, 2026-08). Original vector work for this project.
  THESIS: a geometric M whose strokes are the Sierra Madre ridgeline, set in
  a ring that echoes the civic-seal genre without copying it. Harvest gold
  on warm charcoal ink; independent project - never an official seal.
  OWN-WORLD: ink #221D14, harvest gold #F5B301, paper #FFFCF4.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <circle cx="32" cy="32" r="29.5" fill="none" stroke="#221d14" stroke-width="4.5"/>
  <path d="M17 44 L17 21 L25 21 L32 31 L39 21 L47 21 L47 44 L40 44 L40 32.5 L34.5 40 L29.5 40 L24 32.5 L24 44 Z"
        fill="#f5b301" stroke="#221d14" stroke-width="2.5" stroke-linejoin="round"/>
</svg>
